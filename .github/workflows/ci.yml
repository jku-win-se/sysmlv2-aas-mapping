name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build aas-metamodel and transformation
        run: mvn package -pl aas-metamodel,transformation --also-make -B -q

      - name: Upload transformation JAR
        uses: actions/upload-artifact@v4
        with:
          name: transformation-jar
          path: transformation/target/transformation-1.0-SNAPSHOT.jar

  transform:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Download transformation JAR
        uses: actions/download-artifact@v4
        with:
          name: transformation-jar
          path: transformation/target/

      - name: Run example test suite
        env:
          TRANSFORMATION_JAR: transformation/target/transformation-1.0-SNAPSHOT.jar
          AAS_MM: aas/model/aas.ecore
          SYSML_MM: lib/metamodels/sysml.ecore
        run: bash examples/run-all.sh
